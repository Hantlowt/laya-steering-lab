tasks:
- name: support_priority
  description: Classify support tickets by whether immediate human intervention is
    required.
  domain: customer_support
  decision:
    type: choice
    labels:
    - URGENT
    - NORMAL
    question: Classify support tickets by whether immediate human intervention is
      required.
    class_descriptions:
      URGENT: outage, security, or material financial harm
      NORMAL: routine help without immediate harm
  semantic_concepts: []
  positive_concepts: []
  negative_concepts: []
  policy: Classify support tickets by whether immediate human intervention is required.
  metadata: {}
- name: support_routing
  description: Route a customer request to the responsible support team.
  domain: customer_support
  decision:
    type: choice
    labels:
    - BILLING
    - TECHNICAL
    - ACCOUNT
    question: Route a customer request to the responsible support team.
    class_descriptions:
      BILLING: payments and invoices
      TECHNICAL: product failures
      ACCOUNT: identity and access settings
  semantic_concepts: []
  positive_concepts: []
  negative_concepts: []
  policy: Route a customer request to the responsible support team.
  metadata: {}
- name: email_action
  description: Choose the operational action for an incoming business email.
  domain: email
  decision:
    type: choice
    labels:
    - REPLY
    - ARCHIVE
    - ESCALATE
    question: Choose the operational action for an incoming business email.
    class_descriptions:
      REPLY: needs a routine response
      ARCHIVE: informational or unsolicited
      ESCALATE: requires authority or urgent handling
  semantic_concepts: []
  positive_concepts: []
  negative_concepts: []
  policy: Choose the operational action for an incoming business email.
  metadata: {}
- name: email_sensitivity
  description: Classify the permitted disclosure level of an email.
  domain: email
  decision:
    type: choice
    labels:
    - PUBLIC
    - INTERNAL
    - CONFIDENTIAL
    question: Classify the permitted disclosure level of an email.
    class_descriptions:
      PUBLIC: safe for public distribution
      INTERNAL: company-only routine material
      CONFIDENTIAL: secrets, personal data, or privileged material
  semantic_concepts: []
  positive_concepts: []
  negative_concepts: []
  policy: Classify the permitted disclosure level of an email.
  metadata: {}
- name: log_severity
  description: Assign operational severity to a system event.
  domain: operations_logs
  decision:
