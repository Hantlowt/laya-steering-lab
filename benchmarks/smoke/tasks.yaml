    - INELIGIBLE
    - REVIEW
    question: Decide whether a merchandise return is allowed under policy.
    class_descriptions:
      ELIGIBLE: within policy
      INELIGIBLE: clearly outside policy
      REVIEW: exception or insufficient evidence
  semantic_concepts: []
  positive_concepts: []
  negative_concepts: []
