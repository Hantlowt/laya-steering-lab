    question: Assess fraud risk for an online order.
    class_descriptions:
      ALLOW: ordinary low-risk purchase
      REVIEW: suspicious but inconclusive
      BLOCK: strong evidence of abuse
  semantic_concepts: []
  positive_concepts: []
  negative_concepts: []
  policy: Assess fraud risk for an online order.
  metadata: {}
