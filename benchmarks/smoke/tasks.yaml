    - STORAGE
    - AUTH
    question: Route an infrastructure event to the owning subsystem.
    class_descriptions:
      NETWORK: connectivity and DNS
      STORAGE: disks, databases, and persistence
      AUTH: credentials and authorization
  semantic_concepts: []
  positive_concepts: []
  negative_concepts: []
  policy: Route an infrastructure event to the owning subsystem.
