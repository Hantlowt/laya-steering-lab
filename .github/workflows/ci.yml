name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -c requirements/constraints.txt -e '.[dev,dashboard]'
      - run: ruff format --check src tests scripts
      - run: ruff check src tests scripts
      - run: pytest
