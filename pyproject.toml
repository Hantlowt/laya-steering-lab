[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "laya-steering-lab"
version = "0.1.0"
description = "Leakage-resistant, training-free specialization experiments for frozen Laya models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Laya Steering Lab contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "safetensors>=0.4,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
pytorch = ["laya>=0.3.20,<0.4"]
mlx = ["laya-mlx>=0.2.0,<0.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dashboard = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.12,<1", "httpx>=0.28,<1"]

[project.scripts]
laya-lab = "laya_steering.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_steering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real downloaded Laya checkpoint"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
